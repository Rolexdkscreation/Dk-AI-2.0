<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#4f46e5" />
  <title>DK AI - Voice Assistant</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: system-ui, sans-serif;
      background: linear-gradient(160deg, #0f172a, #1e1b4b); color: #e2e8f0;
      display: flex; flex-direction: column; align-items: center;
    }
    header { padding: 20px; text-align: center; }
    h1 { margin: 0; font-size: 1.5rem; }
    .sub { opacity: .7; font-size: .9rem; margin-top: 4px; }
    #mic {
      width: 150px; height: 150px; border-radius: 50%; border: none; cursor: pointer;
      background: #4f46e5; color: white; font-size: 3rem; margin: 20px 0;
      box-shadow: 0 0 0 0 rgba(79,70,229,.6); transition: transform .2s;
    }
    #mic.listening { background: #dc2626; animation: pulse 1.2s infinite; }
    #mic:active { transform: scale(.95); }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(220,38,38,.6); }
      70% { box-shadow: 0 0 0 30px rgba(220,38,38,0); }
      100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
    }
    #status { min-height: 1.4em; font-weight: 600; }
    #log {
      width: 100%; max-width: 560px; flex: 1; padding: 16px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg { padding: 10px 14px; border-radius: 14px; max-width: 85%; line-height: 1.4; white-space: pre-wrap; }
    .you { align-self: flex-end; background: #334155; }
    .ai { align-self: flex-start; background: #312e81; }
    form { width: 100%; max-width: 560px; display: flex; gap: 8px; padding: 12px 16px 20px; }
    input {
      flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #475569;
      background: #0f172a; color: #e2e8f0; font-size: 1rem;
    }
    button.send { padding: 12px 18px; border-radius: 10px; border: none; background: #4f46e5; color: white; font-size: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>DK AI Assistant</h1>
    <div class="sub">Mic dabao aur bolo, ya neeche type karo</div>
  </header>

  <button id="mic" aria-label="Bolne ke liye dabao">🎤</button>
  <div id="status"></div>

  <div id="log"></div>

  <form id="form">
    <input id="text" placeholder="Yahan likho, e.g. time kya hai" autocomplete="off" />
    <button class="send" type="submit">Bhejo</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
